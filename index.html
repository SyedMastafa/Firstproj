<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD Price Tracker | সেরা গ্যাজেট ডিল</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .product-card:hover { transform: translateY(-5px); transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Navbar -->
    <nav class="bg-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-600">BD Price Tracker</h1>
            <button onclick="fetchProducts()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                রিফ্রেশ করুন
            </button>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="bg-blue-600 text-white py-16 text-center">
        <h2 class="text-4xl font-extrabold mb-4">আজকের সেরা টেক ডিলগুলো দেখুন</h2>
        <p class="text-blue-100">সরাসরি স্টার টেক এবং অন্যান্য শপ থেকে অটো-আপডেটেড দাম</p>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-12">
        <!-- Loading Spinner -->
        <div id="loading" class="text-center py-20">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-600"></div>
            <p class="mt-4 text-gray-600 font-semibold">ডাটা লোড হচ্ছে...</p>
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 hidden">
            <!-- Products will be injected here by JavaScript -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="text-center py-20 hidden">
            <p class="text-gray-500 text-xl">দুঃখিত, কোনো প্রোডাক্ট পাওয়া যায়নি।</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-10 text-center">
        <p>© ২০২৪ BD Price Tracker | জিরো কস্ট অটোমেটেড সিস্টেম</p>
        <p class="text-gray-400 text-sm mt-2">Affiliate Marketing-এর মাধ্যমে ইনকাম জেনারেট করা হচ্ছে</p>
    </footer>

    <script>
        // ১. আপনার Supabase ক্রেডেনশিয়াল এখানে দিন
        const SUPABASE_URL = 'আপনার_SUPABASE_URL_এখানে_দিন';
        const SUPABASE_ANON_KEY = 'আপনার_SUPABASE_ANON_KEY_এখানে_দিন';

        // ২. সুপাবেস ক্লায়েন্ট তৈরি
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchProducts() {
            const grid = document.getElementById('product-grid');
            const loading = document.getElementById('loading');
            const emptyState = document.getElementById('empty-state');

            loading.classList.remove('hidden');
            grid.classList.add('hidden');
            emptyState.classList.add('hidden');

            // ৩. ডাটাবেস থেকে ডাটা আনা
            const { data, error } = await supabase
                .from('products')
                .select('*')
                .order('price', { ascending: true });

            loading.classList.add('hidden');

            if (error || !data || data.length === 0) {
                emptyState.classList.remove('hidden');
                console.error('Error:', error);
                return;
            }

            // ৪. ডাটাগুলো HTML-এ দেখানো
            grid.innerHTML = '';
            data.forEach(product => {
                const card = `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden product-card border border-gray-100">
                        <div class="h-48 bg-gray-100 flex items-center justify-center p-4">
                            <img src="${product.image}" alt="${product.name}" class="max-h-full max-w-full object-contain">
                        </div>
                        <div class="p-5">
                            <h3 class="text-lg font-bold text-gray-800 h-14 overflow-hidden line-clamp-2">
                                ${product.name}
                            </h3>
                            <div class="mt-4 flex items-center justify-between">
                                <span class="text-2xl font-black text-green-600">৳${product.price.toLocaleString()}</span>
                            </div>
                            <a href="${product.link}" target="_blank" 
                               class="mt-5 block w-full text-center bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">
                                অফারটি দেখুন
                            </a>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });

            grid.classList.remove('hidden');
        }

        // পেজ লোড হলে ডাটা ফেচ করা শুরু হবে
        window.onload = fetchProducts;
    </script>
</body>
</html>
